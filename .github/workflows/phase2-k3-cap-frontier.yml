name: Phase 2 K3 rank-cap frontier

on:
  push:
    branches: [agent/phase2-k3-stability]
    paths:
      - research/phase2_k3_cap_wrapper.py
      - .github/workflows/phase2-k3-cap-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        class_name:
          - EstimatorK2
          - EstimatorJ16
          - EstimatorJ32
          - EstimatorJ64
          - EstimatorJ128
          - EstimatorJ256
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      WHEST_SKIP_HARDWARE_FALLBACK_PROBES: "1"
      PYTHONPATH: ${{ github.workspace }}/research/generated

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact Phase 2 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flopscope==0.12.0" \
            "whestbench==0.16.0" \
            "numpy>=2.2,<2.5" \
            "scipy>=1.15,<2"
          python - <<'PY'
          from importlib.metadata import version
          expected = {"flopscope": "0.12.0", "whestbench": "0.16.0"}
          for package, wanted in expected.items():
              got = version(package)
              print(f"{package}={got}")
              if got != wanted:
                  raise SystemExit(f"expected {package}=={wanted}, got {got}")
          PY

      - name: Vendor pinned public K3 reference
        run: |
          mkdir -p research/generated research/results
          curl --fail --location --retry 4 \
            https://raw.githubusercontent.com/paulrosu11/arc-cumulant-mlp-estimator/c1ba08c3072d857683e4f55114f9e9a558e4308c/whitebox_estimator/algorithm/estimator.py \
            --output research/generated/paul_k3_estimator.py
          cp research/phase2_k3_cap_wrapper.py research/generated/estimator.py
          python -m py_compile \
            research/generated/paul_k3_estimator.py \
            research/generated/estimator.py
          sha256sum research/generated/paul_k3_estimator.py

      - name: Validate contract
        run: |
          set +e
          whest validate \
            --estimator research/generated/estimator.py \
            --class "${{ matrix.class_name }}" \
            --format json \
            > "research/results/validate_${{ matrix.class_name }}.json" \
            2> "research/results/validate_${{ matrix.class_name }}.log"
          status=$?
          set -e
          echo "validate_status=$status"
          cat "research/results/validate_${{ matrix.class_name }}.log" || true

      - name: Run one fixed official Phase 2 mini MLP
        run: |
          set +e
          whest run \
            --estimator research/generated/estimator.py \
            --class "${{ matrix.class_name }}" \
            --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 \
            --split mini \
            --n-mlps 1 \
            --runner subprocess \
            --max-threads 2 \
            --wall-time-limit 120 \
            --format json \
            --debug \
            > "research/results/${{ matrix.class_name }}.json" \
            2> "research/results/${{ matrix.class_name }}.log"
          status=$?
          set -e
          echo "$status" > "research/results/${{ matrix.class_name }}.status"
          python - <<'PY'
          import json
          from pathlib import Path

          name = "${{ matrix.class_name }}"
          path = Path("research/results") / f"{name}.json"
          print(f"run_status={Path('research/results', name + '.status').read_text().strip()}")
          if not path.exists() or not path.stat().st_size:
              print("no JSON report")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text())
          except Exception as exc:
              print(f"invalid JSON: {exc}")
              print(path.read_text()[:2000])
              raise SystemExit(0)

          wanted = {
              "adjusted_final_layer_score",
              "final_layer_mse",
              "all_layers_mse",
              "mean_effective_compute",
              "mean_compute_utilization",
              "mean_score_multiplier",
              "failed_mlps",
              "error_code",
              "budget_exhausted",
              "time_exhausted",
              "residual_wall_time_exhausted",
          }
          found = []
          def walk(obj, prefix=""):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      here = f"{prefix}.{key}" if prefix else key
                      if key in wanted and not isinstance(value, (dict, list)):
                          found.append((here, value))
                      walk(value, here)
              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      walk(value, f"{prefix}[{index}]")
          walk(data)
          for key, value in found:
              print(f"{key}={value}")
          if not found:
              print(json.dumps(data, indent=2)[:4000])
          PY
          echo "--- stderr tail ---"
          tail -n 120 "research/results/${{ matrix.class_name }}.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-k3-${{ matrix.class_name }}-${{ github.run_id }}
          path: research/results
          if-no-files-found: warn
          retention-days: 30
