name: Whest adjoint-shadow closure

on:
  pull_request:
    branches:
      - agent/whest-research
    paths:
      - "research/shadow/**"
      - ".github/workflows/whest-shadow.yml"

permissions:
  contents: read

jobs:
  train-shadow-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.5,<2.9" "datasets>=4,<6" "pyarrow>=18" numpy scipy
          python -m pip check

      - name: Train and validate frozen-trajectory shadow closure
        run: |
          python research/shadow/train_shadow.py \
            --dataset mini \
            --train-count 80 \
            --val-count 20 \
            --hidden 12 \
            --epochs 32 \
            --seed 20260810 \
            --output research/shadow/artifacts/mini_v1

      - name: Show metrics
        if: always()
        run: |
          cat research/shadow/artifacts/mini_v1/metrics.json 2>/dev/null || true
          tail -n 160 research/shadow/artifacts/mini_v1/training.log 2>/dev/null || true

      - name: Upload model and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-closure-mini-${{ github.run_id }}
          path: research/shadow/artifacts/mini_v1
          if-no-files-found: warn
          retention-days: 30
