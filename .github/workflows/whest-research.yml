name: Whest current-harness research

on:
  workflow_dispatch:
    inputs:
      n_mlps:
        description: Number of public mini MLPs per estimator
        required: false
        default: "3"
  push:
    branches:
      - agent/whest-research
    paths:
      - "research/**"
      - ".github/workflows/whest-research.yml"

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      N_MLPS: ${{ github.event.inputs.n_mlps || '3' }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      WHEST_SKIP_HARDWARE_FALLBACK_PROBES: "1"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the exact current grader libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flopscope==0.10.0" "whestbench==0.14.0" scipy
          python -m pip check
          whest version --format json

      - name: Run estimator tournament
        run: bash research/run_current_tournament.sh

      - name: Show compact summary
        if: always()
        run: |
          echo "--- summary ---"
          cat research/results/summary.txt 2>/dev/null || true
          echo "--- logs ---"
          for f in research/results/*.log; do
            echo "===== $f ====="
            tail -n 80 "$f" || true
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whest-current-tournament-${{ github.run_id }}
          path: research/results
          if-no-files-found: warn
          retention-days: 30

